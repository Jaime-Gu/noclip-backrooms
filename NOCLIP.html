LIGHTSOFF_DURATION_MIN:6,LIGHTSOFF_DURATION_MAX:8,LIGHTSOFF_FLOOR:.25,LIGHTSOFF_COOLDOWN:45,LIGHTSOFF_COST:8,STEAM_DURATION:2,STEAM_COOLDOWN:30,STEAM_COST:6,KNOCK_COST:4,KNOCK_TAPS_MIN:4,KNOCK_TAPS_MAX:7,FILES_TOTAL:8,FILES_COMPLETE_SECONDS:6,TOAST_SECONDS:2.5,CONTROL_HINT_SECONDS:5,WAKE_BUTTON_LABEL:"wake up"},Ke={VISITED:"noclip_visited",DOCS:"noclip_docs",NOTES:"noclip_notes",BEST_TIME:"noclip_best_time",LAST_TIME:"noclip_last_time",RUN_COUNT:"noclip_run_count",DEEPEST:"noclip_deepest",EXIT_DEPTH:"noclip_exit_depth",MUTED:"noclip_muted"},xn=[{id:"level-0",code:"LEVEL FILE 0",title:'LEVEL 0 — "THE LOBBY"',colloquial:"the yellow rooms",survivalClass:"CLASS 1",classNote:"SAFE // UNSTABLE GEOMETRY // MINIMAL ENTITY CONTACT",body:["Level 0 is an expanse of empty office rooms, indeterminate in size, finished in damp yellow wallpaper, moist office carpet and humming fluorescent ceiling fixtures. No two rooms are identical, yet every room is the same room. Wanderers report the wallpaper pattern repeating with an error roughly every four hundred meters, though measurement is unreliable here.","The fluorescent hum sits at a constant 60 hertz and is measurably louder than the fixtures should permit. Attempts to trace wiring have failed; the lights simply are. The carpet exudes an unidentified fluid. It is not water. Do not drink it.","Spatial geometry on Level 0 is non-euclidean at the margins. Walking in a straight line rarely returns you to where you started, and retracing your steps produces different rooms than the ones you walked through. Compasses spin. Radios find only the hum.",'Entry is most commonly achieved by "noclipping" — a collision failure between the wanderer and consensus reality, usually triggered in liminal spaces: stairwell landings, service corridors, empty conference suites. There is no confirmed reliable exit. Documented exits manifest as ordinary office doors, cleaner than their surroundings.'],quote:"day one. the wallpaper is wet but my hands come away dry. i have stopped asking the building questions. it does not answer, but it listens.",alias:"yellowwall_jane"},{id:"level-1",code:"LEVEL FILE 1",title:'LEVEL 1 — "HABITABLE ZONE"',colloquial:"the dark warehouse",survivalClass:"CLASS 1",classNote:"MOSTLY SAFE // DIM // SPARSE SUPPLIES",body:["Level 1 resembles a maintenance warehouse of concrete pillars, chain-link cages and low brick office annexes, lit by failing ceiling lamps that go dark for hours at a time. Supply crates materialize here — canned food, batteries, Almond Water — and dematerialize when unobserved. Take what you need when you see it.",'During "lights-off" periods, entities emerge from the deep dark and the level is no longer considered safe. Wanderers are advised to carry two light sources and to never sleep in the open. M.E.G. Base Alpha operates here and maintains the majority of our archive.',"The air smells of dust and machine oil. Sounds carry strangely: a footstep one aisle over may be reported by your own ears as behind you. Trust distances, not directions.","Connections to Level 0 occur through maintenance stairwells and service elevators that were not there a moment before. If the stairs keep going past where the building should end, keep climbing. Coming back down does not work."],quote:"the crates are a joke the dark tells. i found three bottles of almond water and turned to call my partner and when i turned back there was a mop. just a mop. i cried a little. i took the mop.",alias:"routepilot"},{id:"level-2",code:"LEVEL FILE 2",title:'LEVEL 2 — "PIPE DREAMS"',colloquial:"the steam pipes",survivalClass:"CLASS 2",classNote:"UNSAFE IN SECTIONS // HOT // ENTITY PRESENCE",body:["Level 2 is an unbroken utility tunnel: black metal pipes, dripping valves, and walls sweating with heat. The corridor never branches, only bends. Sections of the tunnel are hot enough to burn on contact; the pipes carry something under pressure, and when a joint fails the steam is white and total.","Sound behaves worse here than anywhere documented. The pipe chorus — a slow, arrhythmic knocking — has been timed against wanderer heart rates and found to synchronize. M.E.G. researchers consider the synchronization intentional. They do not agree on whose intention.","Maintenance doors along the tunnel open into small supply rooms, air pockets of relative calm. Mark them. The tunnel shifts at a rate of roughly one door per day, and an unmarked door is a rumor.","Do not follow the sound of running water uphill. There is no uphill on Level 2."],quote:"the knocking learned my name. i do not mean it spoke. i mean the rhythm of it matches the rhythm of me saying my own name, and it started three days after i stopped saying it out loud.",alias:"valve_keeper"},{id:"level-run",code:"LEVEL FILE !",title:'LEVEL ! — "RUN FOR YOUR LIFE"',colloquial:"run",survivalClass:"CLASS 5",classNote:"DO NOT ENTER // LINEAR // PURSUIT",body:["Level ! is a hospital corridor approximately ten kilometers long, lit red, with doors that do not open and exit signs that count down. Upon entry the wanderer hears, at the edge of hearing, the corridor behind them filling up. There is one direction. You run it.","Entities pursue at a constant pace slightly slower than a panicked human sprint. The corridor is designed — and the archive uses that word deliberately — to keep you running at the edge of your endurance for its full length. Obstacles appear: gurneys, chairs, spilled fluids. They are always exactly where a tired person would fail to look.","Survivors describe the last kilometer as the loudest silence they have ever experienced. The exit is a set of double doors that are always exactly as far away as you can still run.","If you find yourself on Level !, you have already made every mistake that leads here. Run anyway."],quote:"i counted exit signs. forty. the last one said EXIT in a handwriting i recognized. mine. i have neat handwriting. i never noticed before.",alias:"sprint_gospel"},{id:"the-hub",code:"LEVEL FILE — HUB",title:"THE HUB",colloquial:"the hub",survivalClass:"CLASS 0",classNote:"SAFE // CENTRAL // REQUIRES KEYS",body:["The Hub is a single underground concrete tunnel lined, at regular intervals, with identical grey doors. Each door is numbered and leads to a numbered level, provided the wanderer holds the corresponding Level Key. Without keys the Hub is simply a very quiet place to rest, and rest here is genuine: no entity has ever been documented inside the Hub.","The hum of Level 0 is audible faintly through the walls, as if the whole yellow expanse presses against the concrete from the other side. Wanderers report that the hum is, here, almost comforting. M.E.G. counselors flag this sentiment as an early symptom of acclimatization.",'Level Keys are small metal keys of no consistent design, found on levels matching their number, always somewhere inconvenient. The mechanism by which a key "matches" a door is not understood and does not appear to be mechanical.',"The Hub has no entrance of its own. Wanderers arrive by falling through the floor of other levels, and the Hub is polite enough to provide a floor to land on."],quote:"every door is labeled and every label is honest. that scared me more than the corridor that chased me. honesty means something is keeping books.",alias:"librarian_null"},{id:"entity-hounds",code:"ENTITY FILE 8",title:'ENTITY 8 — "HOUNDS"',colloquial:"hounds",survivalClass:"ENTITY CLASS 4",classNote:"HOSTILE // LIGHT-SENSITIVE // DO NOT RUN",body:["Evidence file. No confirmed visual record exists of Entity 8 in full light. The archive assembles this entry from twenty-three field reports, six recovered audio logs, and one camera that was found pointed at a wall.","Hounds are quadrupedal, roughly human-sized, and assemble themselves from the posture of things: a stack of chairs, a coil of cable, the shadow of a shelving unit. Reports agree that the entity is most visible in the moment you decide not to look at it. Peripheral movement is the only consistent description — low, fast, and always at the edge of a light pool.","Direct light causes the entity to still. Wanderers who keep a Hound lit report it waiting, patiently, for the battery to die. Running triggers immediate pursuit at speeds no wanderer has outrun. Walking away slowly, light held steady, is the only documented survival behavior.",'The audio logs contain breathing that analysts describe as "human-adjacent, as if practiced." One log contains forty seconds of the wanderer whispering good boy. The wanderer survived. The archive does not know what to do with this information.'],quote:"it was made of the coat rack and the mop and something that wanted very badly to be a dog. i kept my flashlight on it for eleven hours. when my second battery died i was already through the door. i think it let me go. i think it was proud of me.",alias:"kennel_psalm"},{id:"object-almond-water",code:"OBJECT FILE 1",title:'OBJECT 1 — "ALMOND WATER"',colloquial:"almond water",survivalClass:"OBJECT CLASS B",classNote:"BENEFICIAL // CONSUME // VERIFY SEAL",body:['Almond Water is a clear, faintly sweet liquid found in unmarked white bottles across most levels. It tastes of almonds and, per several reports, of "being remembered fondly." Consumption restores hydration, clears the mind, and measurably slows the psychological erosion associated with long-term wandering. M.E.G. field rations assume three bottles per week.','The liquid does not spoil, does not freeze, and does not evaporate. Bottles left in one location are sometimes found refilled. The archive has stopped asking where it comes from after the third analysis team returned the same result: water, almond extract, and one unidentified trace compound that resists spectroscopy by being, in the words of the report, "polite."',"Counterfeit Almond Water exists. Verify the seal: genuine bottles are sealed with a plain white cap and make no sound when shaken. A bottle that hums is not Almond Water, regardless of label.",'In emergencies — disorientation, memory loss, the early signs of "wretched cycle" onset — Almond Water is the first and often only effective intervention. Wanderers are advised to drink before they feel they need to.'],quote:"i keep one for emergencies and one for kindness. the kindness one is for whoever i find crying in the carpet. so far, twice, it has been me.",alias:"wellwisher_9"},{id:"data-corrupted",code:"FILE ▓▓▓▓",title:"[DATA CORRUPTED]",colloquial:"████████",survivalClass:"CLASS ▓",classNote:"████████ // ████████ // ████████",corrupted:!0,body:["The subject level exhibits ████████████ behavior consistent with ████████. Wanderers entering the area report ██████████ and should under no circumstances ████████ the ████████.","Recovered footage shows a room in which the wallpaper is ████████. The archivist notes that this should not be possible, as ████████████. Three members of the survey team ████████ and were recovered ████ days later, unwilling to ████████.","The humming on this level does not come from the lights. The humming comes from ████████████. M.E.G. command has ████████ all further ████████.","If you are reading this entry, you have already ████████████. The door you came through is ████████. Do not ████████. Do not ████████. ████████████ ████████████ ████████████."],quote:"we wrote this file so that you would stop looking for this file. please. there are other files.",alias:"archivist_▓"}],sm=[{text:"day 3. the hum changes key when i stop walking. so i don't stop walking.",alias:"routepilot",ago:"logged 41 days ago"},{text:"found a meeting room with 40 chairs and a whiteboard that said SEE YOU SOON. marker still wet.",alias:"yellowwall_jane",ago:"logged 38 days ago"},{text:"if you find almond water, drink it before you need it. trust me. trust me. trust",alias:"wellwisher_9",ago:"logged 33 days ago"},{text:"the carpet is damp everywhere except one perfect dry rectangle in every room. i don't stand in them anymore.",alias:"tile_sleeper",ago:"logged 29 days ago"},{text:"someone ahead of me is scratching arrows into the wallpaper. they all point the way i was already going.",alias:"librarian_null",ago:"logged 24 days ago"},{text:"the lights went out for nine seconds. something in the dark was polite enough to pretend it wasn't there.",alias:"kennel_psalm",ago:"logged 19 days ago"},{text:"my shadow was half a second late today. writing this down so it counts as evidence. not for me. for whoever is keeping the books.",alias:"valve_keeper",ago:"logged 14 days ago"},{text:"i heard my mother's voice behind a door. i did not open it. i want it on record that i did not open it.",alias:"sprint_gospel",ago:"logged 9 days ago"},{text:"the rooms are always available. the rooms are always available. i don't remember writing the first half of this note.",alias:"archivist_▓",ago:"logged 4 days ago"},{text:"to whoever pins the next note: you are not the last one. that is the good news and the bad news.",alias:"meridian_guest",ago:"logged 1 day ago"}],ar={company:"Meridian Conference Solutions",tagline:"Meeting Room Rental Since 1987",faxDigits:"4145550187",rooms:[{name:"Aster",sqft:240,seats:8,note:"South-facing. Chalkboard. Excellent acoustics."},{name:"Birch",sqft:410,seats:16,note:"Projector ready. Coffee service available."},{name:"Cascade",sqft:690,seats:40,note:"Our flagship suite. Always available."}]};function Gt(s){try{return localStorage.getItem(s)}catch{return null}}function Kt(s,r){try{localStorage.setItem(s,r)}catch{}}const He={get visited(){return Gt(Ke.VISITED)==="1"},setVisited(){Kt(Ke.VISITED,"1")},getDocs(){try{const s=Gt(Ke.DOCS);if(!s)return[];const r=JSON.parse(s);return Array.isArray(r)?r.filter(i=>typeof i=="string"):[]}catch{return[]}},addDoc(s){const r=this.getDocs();r.includes(s)||(r.push(s),Kt(Ke.DOCS,JSON.stringify(r)))},getNotes(){try{const s=Gt(Ke.NOTES);if(!s)return[];const r=JSON.parse(s);return Array.isArray(r)?r:[]}catch{return[]}},addNote(s){const r=this.getNotes();r.push(s
